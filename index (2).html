<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>경제는 나에게 맡겨! (6주제 - 심화(환불 교환))</title>
<style>
:root{
  --bg:#fff7fa; --pink:#ff9fa7; --pink2:#ffd4d8; --mint:#a9e5d2;
  --cyan:#afe8ea; --text:#414141; --white:#fff; --shadow:#d9d9d9;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:"Nanum Gothic","Malgun Gothic",sans-serif;color:var(--text)}
button{font:inherit}
.app{height:100dvh;width:100%;max-width:1500px;margin:auto;overflow:hidden}
.screen{display:none;width:100%;height:100%;overflow:hidden}.screen.active{display:flex;flex-direction:column}
.home{width:min(960px,94vw);margin:auto;text-align:center}
.home h1{margin:0;color:#ff7887;font-size:clamp(38px,7vh,76px);line-height:1.08;text-shadow:0 7px 0 #ffe1e5;font-weight:900}
.credit{display:inline-block;margin:26px 0 0;padding:12px 28px;border-radius:28px;background:#fff;box-shadow:0 9px 20px rgba(0,0,0,.08);font-size:clamp(18px,2.6vh,28px);font-weight:800;color:#777}
.menu{display:grid;gap:clamp(18px,3vh,34px);margin-top:clamp(34px,6vh,70px)}
.menu button{border:5px solid #fff;border-radius:999px;padding:clamp(19px,3vh,34px);font-size:clamp(22px,3.8vh,38px);font-weight:900;color:#4b4b4b;box-shadow:0 11px 22px rgba(0,0,0,.12);cursor:pointer}
.menu .m1{background:#ffd5bb}.menu .m2{background:#a8e5cf}.menu .m3{background:#afe6e9}

.topbar{height:88px;flex:0 0 88px;background:#fff;display:flex;align-items:center;gap:16px;padding:10px 24px;box-shadow:0 8px 20px rgba(0,0,0,.06)}
.counter{flex:0 0 auto;background:#ffaaa9;color:#fff;border-radius:25px;padding:12px 24px;font-size:clamp(24px,3.7vh,38px);font-weight:900;box-shadow:0 7px 0 #f39797}
.progress{flex:1;height:22px;background:#e8e8e8;border-radius:30px;overflow:hidden}.fill{height:100%;background:var(--mint);transition:.25s}
.content{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(12px,2vh,24px)}
.homebar{height:98px;flex:0 0 98px;background:#fff;display:flex;justify-content:center;align-items:center}
.homebtn{border:3px solid #eee;background:#fff;border-radius:28px;padding:14px 34px;font-size:clamp(20px,3vh,30px);font-weight:900;box-shadow:0 6px 0 #ddd;cursor:pointer}

/* Mode 1 */
.prompt{width:min(1120px,92vw);background:#fff;border:5px solid var(--cyan);border-radius:34px;padding:clamp(18px,3vh,38px);font-size:clamp(28px,4.7vh,52px);font-weight:900;text-align:center;box-shadow:0 12px 24px rgba(0,0,0,.07)}
.instruction{margin:14px 0 8px;color:#ff8189;font-size:clamp(20px,3.2vh,34px);font-weight:900}
.answerbox{width:min(880px,82vw);height:78px;border:5px dashed #ffb1b4;border-radius:26px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:clamp(30px,4.8vh,50px);font-weight:900;letter-spacing:5px}
.keyboard{width:min(1080px,94vw);display:grid;grid-template-columns:repeat(10,1fr);gap:8px;margin-top:18px;background:#fff;border-radius:28px;padding:18px 22px;box-shadow:0 10px 22px rgba(0,0,0,.1)}
.key{border:2px solid #e7e7e7;background:#fff;border-radius:13px;min-height:57px;font-size:clamp(22px,3.8vh,39px);font-weight:900;box-shadow:0 6px 0 #d7d7d7;cursor:pointer}
.key.action{font-size:clamp(17px,2.6vh,27px)}.key.enter{background:#aee7e9;border-color:#78d1d5}.key.wide{grid-column:span 2}



.keyboard-note{
  margin-top:8px;
  color:#777;
  font-size:clamp(13px,1.9vh,18px);
  font-weight:700;
  text-align:center;
}

/* Mode 2 */
.word-card{width:min(720px,85vw);background:#fff;border:5px solid #ffd2b8;border-radius:30px;padding:20px;text-align:center;font-size:clamp(32px,5vh,55px);font-weight:900}
.sentence-input{width:min(1080px,94vw);height:82px;margin-top:16px;border:5px dashed #9dddc9;border-radius:26px;background:#fff;display:flex;align-items:center;padding:0 24px;font-size:clamp(23px,3.6vh,38px);font-weight:800;overflow:hidden;white-space:nowrap}
.mode2-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.actionbtn{border:none;border-radius:22px;padding:12px 22px;font-size:clamp(17px,2.7vh,26px);font-weight:900;box-shadow:0 6px 0 #c7c7c7;cursor:pointer}
.read{background:#fff1bd}.record{background:#ffc7cf}.stop{background:#ddd}.play{background:#c8f0e3}.next{background:#d7f5bd}
.status{margin-top:10px;min-height:30px;font-size:clamp(16px,2.4vh,23px);font-weight:800;color:#666}
.mode2 .keyboard{margin-top:12px}

/* Mode 3 */
.blank-sentence{width:min(1120px,92vw);background:#fff;border:5px solid var(--cyan);border-radius:34px;padding:clamp(24px,4vh,44px);font-size:clamp(30px,5vh,54px);font-weight:900;text-align:center}
.blank{display:inline-block;min-width:170px;color:#ff7d87;border-bottom:7px solid #ff9da5;padding:0 12px}
.options{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;margin-top:28px}
.option{min-width:210px;border:none;border-radius:28px;background:#fff;padding:22px 35px;font-size:clamp(26px,4.3vh,46px);font-weight:900;box-shadow:0 10px 24px rgba(0,0,0,.1);cursor:pointer}
.option.correct{background:#dff8e7}.option.wrong{background:#ffe4e4}

/* feedback */
.feedback{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.18);z-index:9999;pointer-events:none}
.feedback.show{display:flex}.symbol{font:900 min(42vw,350px)/1 Arial;color:red}.ftext{position:absolute;bottom:12%;background:#fff;border:4px solid #ff7777;border-radius:22px;padding:12px 24px;color:#d71920;font-size:32px;font-weight:900}

/* responsive fit */
@media(max-height:760px){
 .topbar{height:68px;flex-basis:68px}.homebar{height:72px;flex-basis:72px}
 .content{padding:8px}.prompt{padding:18px}.keyboard{margin-top:10px;padding:10px 14px;gap:6px}
 .key{min-height:44px}.instruction{margin:7px 0}.answerbox{height:60px}
 .word-card{padding:12px}.sentence-input{height:60px}.mode2-actions{margin-top:8px}.status{margin-top:4px}
 .blank-sentence{padding:22px}.options{margin-top:16px}
}
@media(max-width:700px){
 .home{width:94vw}.menu button{padding:18px;font-size:22px}.credit{font-size:16px;padding:10px 18px}
 .topbar{padding:8px 10px;gap:9px}.counter{padding:10px 14px;font-size:23px}
 .content{padding:7px}.prompt{width:96vw;font-size:25px;padding:16px}.instruction{font-size:19px}.answerbox{width:92vw;height:58px;font-size:28px}
 .keyboard{width:98vw;grid-template-columns:repeat(5,1fr);padding:10px;gap:6px;max-height:48vh;overflow:hidden}
 .key{min-height:42px;font-size:24px}.key.wide{grid-column:span 1}.key.action{font-size:16px}
 .word-card{font-size:30px}.sentence-input{width:96vw;font-size:21px;height:60px}
 .mode2 .keyboard{max-height:37vh}
 .actionbtn{padding:9px 13px;font-size:16px}
 .blank-sentence{width:96vw;font-size:27px;padding:20px 12px}.blank{min-width:120px}.option{min-width:130px;padding:17px 22px;font-size:28px}
 .homebtn{padding:10px 18px;font-size:20px}
}
@media(max-height:560px){
 .home h1{font-size:34px}.credit{margin-top:10px}.menu{margin-top:18px;gap:10px}.menu button{padding:12px}
 .topbar{height:54px;flex-basis:54px}.homebar{height:56px;flex-basis:56px}
 .keyboard{max-height:45vh}.key{min-height:35px}.prompt{font-size:22px;padding:10px}.answerbox{height:48px}
 .word-card{font-size:25px;padding:8px}.sentence-input{height:48px}.mode2 .keyboard{max-height:34vh}
}
</style>
</head>
<body>
<div class="app">
<section id="home" class="screen active">
  <div class="home">
    <h1>경제는 나에게 맡겨!<br>(6주제 - 심화(환불 교환))</h1>
    <div class="credit">- 제작: 돈비경제 강수향, 김조은, 조연희 -</div>
    <div class="menu">
      <button class="m1" onclick="startMode1()">모드 1: 뜻/단어 맞추기 (키보드)</button>
      <button class="m2" onclick="startMode2()">모드 2: 나만의 문장 만들기·읽기·녹음</button>
      <button class="m3" onclick="startMode3()">모드 3: 생활 문장 빈칸 채우기</button>
    </div>
  </div>
</section>

<section id="mode1" class="screen">
  <div class="topbar"><div id="m1count" class="counter">1 / 4</div><div class="progress"><div id="m1fill" class="fill"></div></div></div>
  <div class="content">
    <div id="m1prompt" class="prompt"></div>
    <div class="instruction">빈칸에 알맞은 단어를 적어 주세요.</div>
    <div id="m1answer" class="answerbox"></div>
    <div id="m1keyboard" class="keyboard"></div><div class="keyboard-note">쌍자음은 같은 자음을 빠르게 두 번 누르거나 길게 눌러요.</div>
  </div>
  <div class="homebar"><button class="homebtn" onclick="goHome()">🏠 홈으로 돌아가기</button></div>
</section>

<section id="mode2" class="screen mode2">
  <div class="topbar"><div id="m2count" class="counter">1 / 2</div><div class="progress"><div id="m2fill" class="fill"></div></div></div>
  <div class="content">
    <div id="m2word" class="word-card"></div>
    <div id="m2instruction" class="instruction">이 단어를 사용해 나만의 문장을 만들어 보세요.</div>
    <div id="m2sentence" class="sentence-input" style="display:none"></div>
    <div class="mode2-actions">
      <button class="actionbtn read" onclick="readMySentence()">🔊 문장 듣기</button>
      <button id="recordBtn" class="actionbtn record" onclick="startRecording()">🎙️ 녹음 시작</button>
      <button id="stopBtn" class="actionbtn stop" onclick="stopRecording()" disabled>⏹ 녹음 종료</button>
      <button id="playBtn" class="actionbtn play" onclick="playRecording()" disabled>▶ 내 목소리 듣기</button>
      <button class="actionbtn next" onclick="nextMode2()">다음 단어 →</button>
    </div>
    <div id="recordStatus" class="status">녹음은 Netlify HTTPS 주소에서 처음 한 번 마이크 사용을 ‘허용’해야 합니다.</div>
    <div id="m2keyboard" class="keyboard"></div><div class="keyboard-note">쌍자음은 같은 자음을 빠르게 두 번 누르거나 길게 눌러요.</div>
  </div>
  <div class="homebar"><button class="homebtn" onclick="goHome()">🏠 홈으로 돌아가기</button></div>
</section>

<section id="mode3" class="screen">
  <div class="topbar"><div id="m3count" class="counter">1 / 8</div><div class="progress"><div id="m3fill" class="fill"></div></div></div>
  <div class="content">
    <div id="blankSentence" class="blank-sentence"></div>
    <div id="blankOptions" class="options"></div>
  </div>
  <div class="homebar"><button class="homebtn" onclick="goHome()">🏠 홈으로 돌아가기</button></div>
</section>
</div>

<div id="feedback" class="feedback"><div id="symbol" class="symbol"></div><div id="ftext" class="ftext"></div></div>

<script>


const topicData={
  title:"경제는 나에게 맡겨!",
  unit:"6주제 - 심화",
  keywordsLabel:"환불 교환",
  creators:["강수향","김조은","조연희"],
  words:[
    {word:"환불",meaning:"산 물건을 돌려주고 돈을 다시 받는 것"},
    {word:"교환",meaning:"산 물건을 다른 것으로 바꾸는 것"}
  ],
  lifeSentences:[
    {keyword:"환불",text:"불량 상품을 환불하고 돈을 다시 받았어요."},
    {keyword:"환불",text:"마음에 들지 않은 옷을 환불했어요."},
    {keyword:"환불",text:"환불한 뒤 카드 결제 금액을 돌려받았어요."},
    {keyword:"환불",text:"물건값을 다시 받기 위해 환불을 신청했어요."},
    {keyword:"교환",text:"작은 옷을 큰 옷으로 교환했어요."},
    {keyword:"교환",text:"파란 가방을 빨간 가방으로 교환했어요."},
    {keyword:"교환",text:"고장 난 장난감을 새 장난감으로 교환했어요."},
    {keyword:"교환",text:"다른 상품으로 바꾸기 위해 교환을 신청했어요."}
  ]
};

const $=id=>document.getElementById(id);
const screens=[...document.querySelectorAll(".screen")];
function show(id){screens.forEach(s=>s.classList.remove("active"));$(id).classList.add("active")}
function goHome(){stopSpeech();stopRecording(true);show("home")}
function speak(text){if(!("speechSynthesis" in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="ko-KR";u.rate=.82;window.speechSynthesis.speak(u)}
function stopSpeech(){if("speechSynthesis" in window)window.speechSynthesis.cancel()}
function showFeedback(ok){$("symbol").textContent=ok?"○":"×";$("ftext").textContent=ok?"정답입니다!":"다시 해 봅시다";$("feedback").classList.add("show");speak(ok?"정답입니다. 잘했어요.":"다시 해 봅시다.");setTimeout(()=>$("feedback").classList.remove("show"),850)}
function shuffle(arr){return [...arr].sort(()=>Math.random()-.5)}

/* Korean on-screen keyboard */
const baseKeys=["ㅂ","ㅈ","ㄷ","ㄱ","ㅅ","ㅛ","ㅕ","ㅑ","ㅐ","ㅔ","ㅁ","ㄴ","ㅇ","ㄹ","ㅎ","ㅗ","ㅓ","ㅏ","ㅣ","지우기","ㅋ","ㅌ","ㅊ","ㅍ","ㅠ","ㅜ","ㅡ","입력"];
const sentenceExtraKeys=["띄어쓰기","마침표"];
function makeKeyboard(container,onKey,{sentenceMode=false}={}){
  container.innerHTML="";
  const keyList=sentenceMode
    ? [...baseKeys.slice(0,-1),...sentenceExtraKeys,"입력"]
    : baseKeys;

  keyList.forEach(k=>{
    const button=document.createElement("button");
    button.className="key"+(
      ["지우기","입력","띄어쓰기","마침표"].includes(k) ? " action" : ""
    );
    if(k==="띄어쓰기") button.classList.add("wide");
    button.textContent=k;
    button.type="button";

    let pressTimer=null;
    let longPressed=false;
    let lastTapAt=0;

    const cancelTimer=()=>{
      if(pressTimer){
        clearTimeout(pressTimer);
        pressTimer=null;
      }
    };

    button.addEventListener("pointerdown",()=>{
      if(!doubleInitialMap[k]) return;
      longPressed=false;
      pressTimer=setTimeout(()=>{
        longPressed=true;
        onKey(doubleInitialMap[k],{replaceLast:false});
      },520);
    });

    button.addEventListener("pointerup",cancelTimer);
    button.addEventListener("pointercancel",cancelTimer);
    button.addEventListener("pointerleave",cancelTimer);

    button.addEventListener("click",()=>{
      if(longPressed){
        longPressed=false;
        return;
      }

      const now=Date.now();
      const quickDouble=
        Boolean(doubleInitialMap[k]) &&
        lastTapAt>0 &&
        now-lastTapAt<=430;

      if(quickDouble){
        onKey(doubleInitialMap[k],{replaceLast:true});
        lastTapAt=0;
      }else{
        onKey(k,{replaceLast:false});
        lastTapAt=now;
      }
    });

    container.appendChild(button);
  });
}

const cho=["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const jung=["ㅏ","ㅐ","ㅑ","ㅒ","ㅓ","ㅔ","ㅕ","ㅖ","ㅗ","ㅘ","ㅙ","ㅚ","ㅛ","ㅜ","ㅝ","ㅞ","ㅟ","ㅠ","ㅡ","ㅢ","ㅣ"];
const jong=["","ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];

const doubleInitialMap={"ㄱ":"ㄲ","ㄷ":"ㄸ","ㅂ":"ㅃ","ㅅ":"ㅆ","ㅈ":"ㅉ"};
const compoundVowelMap={
  "ㅗㅏ":"ㅘ","ㅗㅐ":"ㅙ","ㅗㅣ":"ㅚ",
  "ㅜㅓ":"ㅝ","ㅜㅔ":"ㅞ","ㅜㅣ":"ㅟ",
  "ㅡㅣ":"ㅢ",
  "ㅑㅣ":"ㅒ","ㅕㅣ":"ㅖ"
};
const compoundFinalMap={
  "ㄱㅅ":"ㄳ","ㄴㅈ":"ㄵ","ㄴㅎ":"ㄶ",
  "ㄹㄱ":"ㄺ","ㄹㅁ":"ㄻ","ㄹㅂ":"ㄼ","ㄹㅅ":"ㄽ","ㄹㅌ":"ㄾ","ㄹㅍ":"ㄿ","ㄹㅎ":"ㅀ",
  "ㅂㅅ":"ㅄ"
};
const consonants=new Set(["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"]);
const vowels=new Set(["ㅏ","ㅐ","ㅑ","ㅒ","ㅓ","ㅔ","ㅕ","ㅖ","ㅗ","ㅘ","ㅙ","ㅚ","ㅛ","ㅜ","ㅝ","ㅞ","ㅟ","ㅠ","ㅡ","ㅢ","ㅣ"]);

function combineVowel(chars,index){
  const first=chars[index];
  const second=chars[index+1];
  const combined=compoundVowelMap[first+second];
  if(combined) return {vowel:combined,used:2};
  return {vowel:first,used:1};
}

function composeJamo(input){
  const chars=[...input];
  let result="";
  let i=0;

  while(i<chars.length){
    const ch=chars[i];

    if(ch===" " || ch==="." || ch==="," || ch==="!" || ch==="?"){
      result+=ch;
      i++;
      continue;
    }

    let initial=ch;
    let initialUsed=1;

    // 같은 기본 자음을 두 번 누른 뒤 모음이 오면 쌍자음 초성으로 결합
    if(doubleInitialMap[ch] && chars[i+1]===ch && vowels.has(chars[i+2])){
      initial=doubleInitialMap[ch];
      initialUsed=2;
    }

    const initialIndex=cho.indexOf(initial);
    const vowelStart=i+initialUsed;

    if(initialIndex>=0 && vowels.has(chars[vowelStart])){
      const v=combineVowel(chars,vowelStart);
      const vowelIndex=jung.indexOf(v.vowel);

      if(vowelIndex>=0){
        let used=initialUsed+v.used;
        let finalIndex=0;

        const f1=chars[i+used];
        const f2=chars[i+used+1];
        const f3=chars[i+used+2];

        if(consonants.has(f1)){
          // 뒤에 모음이 바로 오면 받침이 아니라 다음 음절 초성
          if(!vowels.has(f2)){
            const compound=compoundFinalMap[f1+f2];
            if(compound && !vowels.has(f3)){
              finalIndex=jong.indexOf(compound);
              used+=2;
            }else{
              const candidate=jong.indexOf(f1);
              if(candidate>0){
                finalIndex=candidate;
                used+=1;
              }
            }
          }
        }

        result+=String.fromCharCode(0xAC00+(initialIndex*21+vowelIndex)*28+finalIndex);
        i+=used;
        continue;
      }
    }

    result+=ch;
    i++;
  }

  return result;
}


/* Mode 1 */
const mode1Questions=[
  {prompt:"산 물건을 돌려주고 돈을 다시 받는 것",answer:"환불"},
  {prompt:"산 물건을 다른 것으로 바꾸는 것",answer:"교환"},
  {prompt:"Q. 옷이 마음에 안 들어서 돌려주고 돈을 다시 받았어요.",answer:"환불"},
  {prompt:"Q. 옷 사이즈가 안 맞아서 다른 것으로 바꾸었어요.",answer:"교환"}
];
let m1Index=0,m1Raw="";
function startMode1(){m1Index=0;m1Raw="";show("mode1");makeKeyboard($("m1keyboard"),handleM1Key,{sentenceMode:false});renderM1()}
function renderM1(){const q=mode1Questions[m1Index];$("m1prompt").textContent=q.prompt;$("m1count").textContent=`${m1Index+1} / ${mode1Questions.length}`;$("m1fill").style.width=`${(m1Index+1)/mode1Questions.length*100}%`;$("m1answer").textContent=composeJamo(m1Raw)}
function handleM1Key(k,meta={}){
  if(k==="지우기"){
    m1Raw=m1Raw.slice(0,-1);
    renderM1();
    return;
  }

  if(k==="입력"){
    const answer=composeJamo(m1Raw);
    const ok=answer===mode1Questions[m1Index].answer;
    showFeedback(ok);

    if(ok){
      setTimeout(()=>{
        m1Index+=1;
        m1Raw="";
        if(m1Index>=mode1Questions.length){
          goHome();
        }else{
          renderM1();
        }
      },900);
    }
    return;
  }

  if(meta.replaceLast && m1Raw.length>0){
    m1Raw=m1Raw.slice(0,-1)+k;
  }else{
    m1Raw+=k;
  }
  renderM1();
}

/* Mode 2 */
let m2Index=0,m2Raw="",mediaRecorder=null,audioChunks=[],audioUrl=null,audioElement=null,recordStream=null;
function startMode2(){
  m2Index=0;
  m2Raw="";
  resetRecording();
  show("mode2");
  makeKeyboard($("m2keyboard"),handleM2Key,{sentenceMode:true});
  renderM2();
}

function renderM2(){
  const word=topicData.words[m2Index].word;
  const composed=composeJamo(m2Raw);
  const instruction=$("m2instruction");

  $("m2word").textContent=`제시 단어: ${word}`;
  $("m2count").textContent=`${m2Index+1} / ${topicData.words.length}`;
  $("m2fill").style.width=`${(m2Index+1)/topicData.words.length*100}%`;

  if(composed){
    instruction.textContent=composed;
    instruction.style.color="#414141";
    instruction.style.background="#ffffff";
    instruction.style.border="4px dashed #9dddc9";
    instruction.style.borderRadius="22px";
    instruction.style.padding="12px 20px";
    instruction.style.width="min(1080px,94vw)";
    instruction.style.minHeight="64px";
    instruction.style.display="flex";
    instruction.style.alignItems="center";
    instruction.style.justifyContent="flex-start";
    instruction.style.overflow="hidden";
    instruction.style.whiteSpace="nowrap";
  }else{
    instruction.textContent="이 단어를 사용해 나만의 문장을 만들어 보세요.";
    instruction.style.color="#ff8189";
    instruction.style.background="transparent";
    instruction.style.border="none";
    instruction.style.padding="";
    instruction.style.width="";
    instruction.style.minHeight="";
    instruction.style.display="block";
    instruction.style.overflow="";
    instruction.style.whiteSpace="";
  }

  $("m2sentence").textContent=composed;
}

function handleM2Key(k,meta={}){
  if(k==="지우기"){
    m2Raw=m2Raw.slice(0,-1);
    renderM2();
    return;
  }

  if(k==="띄어쓰기"){
    if(m2Raw.length>0 && !m2Raw.endsWith(" ")){
      m2Raw+=" ";
    }
    renderM2();
    return;
  }

  if(k==="마침표"){
    if(!m2Raw.endsWith(".")){
      m2Raw+=".";
    }
    renderM2();
    return;
  }

  if(k==="입력"){
    const sentence=composeJamo(m2Raw).trim();
    if(!sentence){
      $("recordStatus").textContent="문장을 먼저 입력해 주세요.";
      return;
    }

    const requiredWord=topicData.words[m2Index].word;
    if(!sentence.includes(requiredWord)){
      $("recordStatus").textContent=
        `문장에 '${requiredWord}'을 넣어 주세요.`;
      return;
    }

    $("recordStatus").textContent=
      "문장이 완성되었습니다. 문장 듣기를 눌러 보세요.";
    speak(sentence);
    return;
  }

  if(meta.replaceLast && m2Raw.length>0){
    m2Raw=m2Raw.slice(0,-1)+k;
  }else{
    m2Raw+=k;
  }
  renderM2();
}

function readMySentence(){const s=composeJamo(m2Raw).trim();if(!s){$("recordStatus").textContent="문장을 먼저 입력해 주세요.";return}speak(s)}
async function startRecording(){
  const secureContext=location.protocol==="https:" || location.hostname==="localhost" || location.hostname==="127.0.0.1";
  if(!secureContext){
    $("recordStatus").textContent="녹음은 HTTPS로 배포된 Netlify 주소 또는 localhost에서만 사용할 수 있습니다.";
    return;
  }
  if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder){
    $("recordStatus").textContent="이 브라우저에서는 녹음을 지원하지 않습니다. 최신 Chrome 또는 Edge를 사용해 주세요.";
    return;
  }

  try{
    stopSpeech();
    resetRecording();

    $("recordStatus").textContent="브라우저의 마이크 사용 창에서 ‘허용’을 눌러 주세요.";
    recordStream=await navigator.mediaDevices.getUserMedia({audio:true});

    mediaRecorder=new MediaRecorder(recordStream);
    audioChunks=[];

    mediaRecorder.ondataavailable=e=>{
      if(e.data.size) audioChunks.push(e.data);
    };

    mediaRecorder.onstop=()=>{
      const blob=new Blob(audioChunks,{type:mediaRecorder.mimeType||"audio/webm"});
      audioUrl=URL.createObjectURL(blob);
      audioElement=new Audio(audioUrl);
      $("playBtn").disabled=false;
      $("recordStatus").textContent="녹음이 완료되었습니다. ‘내 목소리 듣기’를 눌러 보세요.";
      if(recordStream){
        recordStream.getTracks().forEach(t=>t.stop());
        recordStream=null;
      }
    };

    mediaRecorder.start();
    $("recordBtn").disabled=true;
    $("stopBtn").disabled=false;
    $("recordStatus").textContent="녹음 중입니다. 문장을 읽고 ‘녹음 종료’를 눌러 주세요.";
  }catch(err){
    if(err?.name==="NotAllowedError"){
      $("recordStatus").textContent="마이크 권한이 차단되었습니다. 주소창의 자물쇠 아이콘 → 사이트 설정 → 마이크 → 허용으로 바꿔 주세요.";
    }else if(err?.name==="NotFoundError"){
      $("recordStatus").textContent="사용할 수 있는 마이크를 찾지 못했습니다.";
    }else{
      $("recordStatus").textContent="마이크를 시작하지 못했습니다. 브라우저 설정과 마이크 연결을 확인해 주세요.";
    }
  }
}
function stopRecording(silent=false){
  if(mediaRecorder&&mediaRecorder.state==="recording")mediaRecorder.stop();
  $("recordBtn").disabled=false;$("stopBtn").disabled=true;
  if(!silent&&(!mediaRecorder||mediaRecorder.state!=="recording")){}
}
function playRecording(){if(audioElement){audioElement.currentTime=0;audioElement.play()}}
function resetRecording(){if(audioElement){audioElement.pause();audioElement=null}if(audioUrl){URL.revokeObjectURL(audioUrl);audioUrl=null}if(recordStream){recordStream.getTracks().forEach(t=>t.stop());recordStream=null}mediaRecorder=null;audioChunks=[];$("recordBtn").disabled=false;$("stopBtn").disabled=true;$("playBtn").disabled=true;$("recordStatus").textContent="녹음은 Netlify HTTPS 주소에서 처음 한 번 마이크 사용을 ‘허용’해야 합니다."}
function nextMode2(){resetRecording();m2Index++;m2Raw="";if(m2Index>=topicData.words.length)goHome();else renderM2()}

/* Mode 3 */
let m3Index=0;
function startMode3(){m3Index=0;show("mode3");renderM3()}
function renderM3(){
  const item=topicData.lifeSentences[m3Index];
  const html=item.text.split(item.keyword).join(`<span class="blank">[　　　]</span>`);
  $("blankSentence").innerHTML=html;
  $("m3count").textContent=`${m3Index+1} / ${topicData.lifeSentences.length}`;
  $("m3fill").style.width=`${(m3Index+1)/topicData.lifeSentences.length*100}%`;
  $("blankOptions").innerHTML="";
  shuffle(topicData.words.map(w=>w.word)).forEach(word=>{
    const b=document.createElement("button");b.className="option";b.textContent=word;
    b.onclick=()=>{const ok=word===item.keyword;b.classList.add(ok?"correct":"wrong");showFeedback(ok);if(ok)setTimeout(()=>{m3Index++;if(m3Index>=topicData.lifeSentences.length)goHome();else renderM3()},900);else setTimeout(()=>b.classList.remove("wrong"),850)};
    $("blankOptions").appendChild(b);
  });
}

Object.assign(window,{startMode1,startMode2,startMode3,goHome,readMySentence,startRecording,stopRecording,playRecording,nextMode2});


</script>
